version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24
  build:
    commands:
      - echo "Zipping Lambda functions........"
      - cd lambda/ticketing-create && zip -r ../../ticketing-create.zip index.js && cd ../..
      - cd lambda/ticketing-get && zip -r ../../ticketing-get.zip index.js && cd ../..
      - cd lambda/ticketing-update && zip -r ../../ticketing-update.zip index.js && cd ../..
      - cd lambda/ticketing-delete && zip -r ../../ticketing-delete.zip index.js && cd ../..
      - echo "Deploying Lambda functions..."
      - aws lambda update-function-code --function-name ticketing-create --zip-file fileb://ticketing-create.zip --region ap-southeast-2
      - aws lambda update-function-code --function-name ticketing-get --zip-file fileb://ticketing-get.zip --region ap-southeast-2
      - aws lambda update-function-code --function-name ticketing-update --zip-file fileb://ticketing-update.zip --region ap-southeast-2
      - aws lambda update-function-code --function-name ticketing-delete --zip-file fileb://ticketing-delete.zip --region ap-southeast-2
      - echo "Deploying frontend to S3..."
      - aws s3 sync frontend/ s3://ticketing-frontend-m-ar-my --delete --region ap-southeast-2
      - echo "Invalidating CloudFront cache..."
      - aws cloudfront create-invalidation --distribution-id E14F4HU4QKQRU9 --paths "/*"

artifacts:
  files:
    - ticketing-create.zip
    - ticketing-get.zip
    - ticketing-update.zip
    - ticketing-delete.zip
