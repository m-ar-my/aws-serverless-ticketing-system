<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ticketing System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f6f8; color: #333; }
    header { background: #232f3e; color: white; padding: 16px 32px; }
    header h1 { font-size: 1.4rem; }
    .container { max-width: 1000px; margin: 32px auto; padding: 0 16px; }
    .card { background: white; border-radius: 8px; padding: 24px; margin-bottom: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    h2 { margin-bottom: 16px; font-size: 1.1rem; color: #232f3e; }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .form-group { display: flex; flex-direction: column; flex: 1; min-width: 180px; }
    label { font-size: 0.85rem; margin-bottom: 4px; font-weight: bold; }
    input, select, textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; }
    textarea { resize: vertical; min-height: 70px; }
    .btn { padding: 9px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.95rem; }
    .btn-primary { background: #ff9900; color: white; margin-top: 16px; }
    .btn-primary:hover { background: #e68a00; }
    .btn-danger { background: #d13212; color: white; font-size: 0.8rem; padding: 5px 10px; }
    .btn-danger:hover { background: #b02a0e; }
    .btn-success { background: #1e8449; color: white; font-size: 0.8rem; padding: 5px 10px; }
    .btn-success:hover { background: #196f3d; }
    .btn-refresh { background: #232f3e; color: white; font-size: 0.85rem; padding: 6px 14px; float: right; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { background: #f4f6f8; text-align: left; padding: 10px; border-bottom: 2px solid #ddd; }
    td { padding: 10px; border-bottom: 1px solid #eee; vertical-align: middle; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.78rem; font-weight: bold; }
    .badge-low { background: #d5f5e3; color: #1e8449; }
    .badge-medium { background: #fef9e7; color: #b7950b; }
    .badge-high { background: #fde8e4; color: #d13212; }
    .badge-open { background: #e8f4fd; color: #1a5276; }
    .badge-in-progress { background: #fef9e7; color: #b7950b; }
    .badge-closed { background: #f2f3f4; color: #626567; }
    .status-select { padding: 5px; font-size: 0.8rem; border-radius: 4px; border: 1px solid #ccc; }
    #message { padding: 10px 16px; border-radius: 4px; margin-bottom: 16px; display: none; }
    .msg-success { background: #d5f5e3; color: #1e8449; display: block !important; }
    .msg-error { background: #fde8e4; color: #d13212; display: block !important; }
    .empty { text-align: center; color: #999; padding: 24px; }
  </style>
</head>
<body>

<header>
  <h1>🎫 Ticketing System</h1>
</header>

<div class="container">

  <div id="message"></div>

  <!-- Create Ticket -->
  <div class="card">
    <h2>Create New Ticket</h2>
    <div class="form-row">
      <div class="form-group" style="flex:2">
        <label for="title">Title *</label>
        <input type="text" id="title" placeholder="e.g. Login page broken" />
      </div>
      <div class="form-group">
        <label for="priority">Priority</label>
        <select id="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>
    <div class="form-row" style="margin-top:12px">
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" placeholder="Describe the issue..."></textarea>
      </div>
    </div>
    <button class="btn btn-primary" onclick="createTicket()">Submit Ticket</button>
  </div>

  <!-- Ticket List -->
  <div class="card">
    <h2>All Tickets <button class="btn btn-refresh" onclick="loadTickets()">↻ Refresh</button></h2>
    <div id="ticket-list"><p class="empty">Loading tickets...</p></div>
  </div>

</div>

<script>
  const API_URL = 'https://xkfvs4luk2.execute-api.ap-southeast-2.amazonaws.com/prod';
  const API_KEY = 'g06Lser460a30wmbE0qbI57CKIP446mn1SuxhLiZ';

  const headers = {
    'Content-Type': 'application/json',
    'x-api-key': API_KEY
  };

  function showMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.className = type === 'success' ? 'msg-success' : 'msg-error';
    setTimeout(() => { el.className = ''; }, 4000);
  }

  async function loadTickets() {
    document.getElementById('ticket-list').innerHTML = '<p class="empty">Loading...</p>';
    try {
      const res = await fetch(`${API_URL}/tickets`, { headers });
      const data = await res.json();
      const body = data.body ? JSON.parse(data.body) : data;
      const tickets = Array.isArray(body) ? body : (body.tickets || body.Items || []);
      if (!tickets.length) {
        document.getElementById('ticket-list').innerHTML = '<p class="empty">No tickets yet. Create one above!</p>';
        return;
      }
      const rows = tickets.map(t => `
        <tr>
          <td>${t.ticketId ? t.ticketId.substring(0, 8) + '...' : '-'}</td>
          <td>${t.title || '-'}</td>
          <td>${t.description || '-'}</td>
          <td><span class="badge badge-${t.priority || 'low'}">${t.priority || 'low'}</span></td>
          <td><span class="badge badge-${t.status || 'open'}">${t.status || 'open'}</span></td>
          <td>${t.createdAt ? new Date(t.createdAt).toLocaleDateString() : '-'}</td>
          <td>
            <select class="status-select" id="status-${t.ticketId}">
              <option value="open" ${t.status === 'open' ? 'selected' : ''}>Open</option>
              <option value="in-progress" ${t.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
              <option value="closed" ${t.status === 'closed' ? 'selected' : ''}>Closed</option>
            </select>
          </td>
          <td>
            <button class="btn btn-success" onclick="updateTicket('${t.ticketId}')">Update</button>
            <button class="btn btn-danger" style="margin-top:4px" onclick="deleteTicket('${t.ticketId}', '${t.createdAt}')">Delete</button>
          </td>
        </tr>
      `).join('');
      document.getElementById('ticket-list').innerHTML = `
        <table>
          <thead><tr><th>ID</th><th>Title</th><th>Description</th><th>Priority</th><th>Status</th><th>Created</th><th>Change Status</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    } catch (err) {
      document.getElementById('ticket-list').innerHTML = '<p class="empty">Failed to load tickets.</p>';
    }
  }

  async function createTicket() {
    const title = document.getElementById('title').value.trim();
    const priority = document.getElementById('priority').value;
    const description = document.getElementById('description').value.trim();
    if (!title) { showMessage('Title is required.', 'error'); return; }
    try {
      const res = await fetch(`${API_URL}/tickets`, {
        method: 'POST',
        headers,
        body: JSON.stringify({ title, priority, description })
      });
      if (res.ok) {
        showMessage('Ticket created successfully!', 'success');
        document.getElementById('title').value = '';
        document.getElementById('description').value = '';
        document.getElementById('priority').value = 'medium';
        loadTickets();
      } else {
        const err = await res.json();
        showMessage(err.message || 'Failed to create ticket.', 'error');
      }
    } catch (err) {
      showMessage('Network error. Check your API URL.', 'error');
    }
  }

  async function updateTicket(ticketId) {
    const status = document.getElementById(`status-${ticketId}`).value;
    try {
      const res = await fetch(`${API_URL}/tickets/${ticketId}`, {
        method: 'PUT',
        headers,
        body: JSON.stringify({ status })
      });
      if (res.ok) {
        showMessage('Ticket updated successfully!', 'success');
        loadTickets();
      } else {
        showMessage('Failed to update ticket.', 'error');
      }
    } catch (err) {
      showMessage('Network error.', 'error');
    }
  }

  async function deleteTicket(ticketId, createdAt) {
    if (!confirm('Delete this ticket?')) return;
    try {
      const res = await fetch(`${API_URL}/tickets/${ticketId}`, {
        method: 'DELETE',
        headers,
        body: JSON.stringify({ createdAt })
      });
      if (res.ok) {
        showMessage('Ticket deleted.', 'success');
        loadTickets();
      } else {
        showMessage('Failed to delete ticket.', 'error');
      }
    } catch (err) {
      showMessage('Network error.', 'error');
    }
  }

  loadTickets();
</script>
</body>
</html>
