<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ticketing System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f6f8; color: #333; }
    header { background: #232f3e; color: white; padding: 16px 32px; }
    header h1 { font-size: 1.4rem; }
    .deploy-banner { background: #ff9900; color: #232f3e; text-align: center; padding: 8px; font-size: 0.9rem; font-weight: bold; }
    .container { max-width: 1000px; margin: 32px auto; padding: 0 16px; }
    .card { background: white; border-radius: 8px; padding: 24px; margin-bottom: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    h2 { margin-bottom: 16px; font-size: 1.1rem; color: #232f3e; }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .form-group { display: flex; flex-direction: column; flex: 1; min-width: 180px; }
    label { font-size: 0.85rem; margin-bottom: 4px; font-weight: bold; }
    input, select, textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; }
    textarea { resize: vertical; min-height: 70px; }
    .btn { padding: 9px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.95rem; }
    .btn-primary { background: #ff9900; color: white; margin-top: 16px; }
    .btn-primary:hover { background: #e68a00; }
    .btn-danger { background: #d13212; color: white; font-size: 0.8rem; padding: 5px 10px; }
    .btn-danger:hover { background: #b02a0e; }
    .btn-success { background: #1e8449; color: white; font-size: 0.8rem; padding: 5px 10px; }
    .btn-success:hover { background: #196f3d; }
    .btn-refresh { background: #232f3e; color: white; font-size: 0.85rem; padding: 6px 14px; float: right; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { background: #f4f6f8; text-align: left; padding: 10px; border-bottom: 2px solid #ddd; }
    td { padding: 10px; border-bottom: 1px solid #eee; vertical-align: middle; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.78rem; font-weight: bold; }
    .badge-low { background: #d5f5e3; color: #1e8449; }
    .badge-medium { background: #fef9e7; color: #b7950b; }
    .badge-high { background: #fde8e4; color: #d13212; }
    .badge-open { background: #e8f4fd; color: #1a5276; }
    .badge-in-progress { background: #fef9e7; color: #b7950b; }
    .badge-closed { background: #f2f3f4; color: #626567; }
    .status-select { padding: 5px; font-size: 0.8rem; border-radius: 4px; border: 1px solid #ccc; }
    #message { padding: 10px 16px; border-radius: 4px; margin-bottom: 16px; display: none; }
    .msg-success { background: #d5f5e3; color: #1e8449; display: block !important; }
    .msg-error { background: #fde8e4; color: #d13212; display: block !important; }
    .empty { text-align: center; color: #999; padding: 24px; }
  </style>
</head>
<body>

<header>
  <h1>🎫 Ticketing System</h1>
</header>

<div class="deploy-banner">
  🚀 Deployed via AWS CodePipeline — CI/CD is live!
</div>

<div class="container">
